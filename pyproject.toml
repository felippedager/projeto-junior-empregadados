[project]
name = "pipeline-ecommerce-india"
version = "0.1.0"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
# dataset/ guarda o script do dado original, que não é nosso: não se reformata.
extend-exclude = ["dataset"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
# source = ["."] faz arquivo que nenhum teste importa contar como 0%.
source = ["."]
# dataset/ guarda o gerador do dado (Data_Extraction.py), que não é parte do pipeline.
omit = ["test/*", ".venv/*", "dataset/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
